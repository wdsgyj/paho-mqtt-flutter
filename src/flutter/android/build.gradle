// Package the prebuilt libmqtt_sdk.so and compile the Kotlin loader only.
// JNI C sources in src/native/jni are compiled by the separate native build.
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'org.paho.mqtt.ffi'
    sourceSets { main { jniLibs.srcDirs = [file('native-libs')] } }
    compileSdk 36
    defaultConfig { minSdk 21; consumerProguardFiles "consumer-rules.pro" }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }
}

